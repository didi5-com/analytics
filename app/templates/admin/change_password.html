{% extends 'base.html' %}
{% block title %}Change Password – EduAnalytics{% endblock %}
{% block content %}
<div class="page-header">
  <h1>🔑 Change Admin Password</h1>
</div>
<div class="form-card">
  <form method="POST" action="{{ url_for('admin.change_password') }}">
    <div class="form-group">
      <label>Current Password <span class="required">*</span></label>
      <input type="password" name="current_password" required>
    </div>
    <div class="form-group">
      <label>New Password <span class="required">*</span></label>
      <input type="password" name="new_password" required minlength="4">
    </div>
    <div class="form-group">
      <label>Confirm New Password <span class="required">*</span></label>
      <input type="password" name="confirm_password" required minlength="4">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn btn-primary">Update Password</button>
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
