packages:
  "recharts": "For rendering dashboard charts and visual analytics"
  "framer-motion": "For smooth page transitions and micro-interactions"
  "date-fns": "For formatting dates in the messaging system"
  "lucide-react": "For beautiful, consistent iconography"
  "clsx": "Utility for conditional class names"
  "tailwind-merge": "Utility for merging tailwind classes safely"
  "@hookform/resolvers": "For integrating Zod validation with React Hook Form"
  "react-hook-form": "For performant form state management"

images:
  - path: "artifacts/edu-analytics/public/images/auth-bg.png"
    description: "Abstract geometric background in deep academic blue and white, subtle gradients, clean modern tech aesthetic"
    aspect_ratio: "16:9"
  - path: "artifacts/edu-analytics/public/images/logo-icon.png"
    description: "Minimalist modern education icon, a stylized graduation cap or book mixed with a data chart line, single color deep blue on transparent background"
    aspect_ratio: "1:1"

notes:
  - Using generated Orval hooks from @workspace/api-client-react
  - Providing Authorization Bearer token explicitly to API hooks via the request.headers option
