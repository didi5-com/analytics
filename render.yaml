services:
  - type: web
    name: edu-analytics
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edu-analytics-db
          property: connectionString

databases:
  - name: edu-analytics-db
    databaseName: education
    user: edu_user
